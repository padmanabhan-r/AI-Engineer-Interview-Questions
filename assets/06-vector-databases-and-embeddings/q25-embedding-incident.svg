<text x="28" y="58" font-size="12.5" fill="#667085" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">An embedding model change is a data migration, not a library upgrade. Roll back first, then find the mixed spaces.</text>
