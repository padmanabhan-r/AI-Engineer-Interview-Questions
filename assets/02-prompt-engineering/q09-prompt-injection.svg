<text x="315.0" y="346.0" font-size="11.5" font-weight="400" fill="#667085" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="italic" opacity="1">Classifiers and labelled delimiters lower the success rate;</text>
