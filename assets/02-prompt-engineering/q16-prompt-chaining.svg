<text x="28.0" y="380.0" font-size="12" font-weight="600" fill="#344054" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">Violet = an LLM call.  Amber = code: validate, branch, look up, compute.</text>
