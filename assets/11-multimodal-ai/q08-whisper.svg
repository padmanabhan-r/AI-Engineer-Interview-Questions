<text x="164.0" y="300.0" font-size="11" font-weight="400" fill="#344054" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">sequential 30 s windows, each</text>
<text x="164.0" y="314.8" font-size="11" font-weight="400" fill="#344054" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">prompted with the previous text</text>
<text x="36.0" y="426.0" font-size="11.5" font-weight="400" fill="#8E2A23" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">Pitfall: it hallucinates fluent text on silence and noise, so gate it with VAD and drop low-confidence segments.</text>
