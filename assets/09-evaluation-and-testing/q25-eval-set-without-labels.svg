<text x="806.0" y="412.0" font-size="11.5" font-weight="700" fill="#7A5300" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">+ calibrated judge</text>
<rect x="32" y="248" width="420" height="104" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="48.0" y="268.0" font-size="12.5" font-weight="700" fill="#344054" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">Calibrate, then scale</text>
<text x="48.0" y="292.0" font-size="11.5" font-weight="400" fill="#344054" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">Calibrate a judge on 50–150 expert-reviewed items,</text>
<text x="48.0" y="310.0" font-size="11.5" font-weight="400" fill="#344054" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">then let it scale, with audits.</text>
<text x="48.0" y="334.0" font-size="11.5" font-weight="400" fill="#0A5A51" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">For RAG, a question generated from a chunk comes with its label.</text>
<text x="32.0" y="392.0" font-size="11.5" font-weight="600" fill="#8E2A23" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">Pitfall: synthetic inputs are cleaner than real ones and drafted labels share the</text>
<text x="32.0" y="410.0" font-size="11.5" font-weight="600" fill="#8E2A23" text-anchor="start" dominant-baseline="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1">model&#x27;s blind spots. The random expert sample measures that error.</text>
</svg>
