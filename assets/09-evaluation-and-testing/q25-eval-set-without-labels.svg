<text x="28" y="36" font-size="18" font-weight="700" fill="#151A23" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Experts as reviewers, not authors</text>
<text x="28" y="58" font-size="12.5" fill="#667085" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Generate cases and draft labels cheaply; spend expert time only on disagreements, a random sample and calibration.</text>
